# 左手 —— 只给仿真用，不要拿它驱动真手。
#
# 和 inspire_right_sim.cfg 是一对，构造完全一样，只差端口：右手 9103、
# 左手 9104。两侧端口**必须不同** —— 撞在一起的话两只手会收到同一份数据，
# 症状是"另一只手跟着这只动"，很难往配置上想；C++ 那边现在会直接拦掉。
#
# 和 inspire_left.cfg 的区别在 open/closed：那份是因时左手 2026-07-21 逐通道
# 实测的行程端点，用来驱动真手；这份故意用满量程 0~1000，于是
#     ticks = 六维命令 × 1000
# 也就是**闭合度 ×1000**，PC 端除以 1000 就直接得到 0~1 的闭合度，不需要知道
# 任何真手的端点。仿真里画的是 URDF 关节，本来也用不到因时的寄存器行程。
#
# 发给本机的 PC 端手套接收器。teleop 走 TCP，所以那边要先监听着。
host=127.0.0.1
port=9104

# 顺序：小指,无名指,中指,食指,拇指弯曲,拇指对掌
open=1000,1000,1000,1000,1000,1000
closed=0,0,0,0,0,0

# BAD_MAG 降级为非致命 —— **仅因为这份配置只喂仿真**。
# 桌面环境（机箱/显示器/排插）的磁场梯度很大，磁力计标定压不住，8 颗传感器
# 会持续报 BAD_MAG，安全看门狗每次都会中止 teleop。
# BAD_MAG 的含义是"当前磁场与标定参考不符"，数据仍在流、手指相对弯曲大致
# 可用，不可信的是绝对朝向 —— 而仿真只用闭合度，用不到绝对朝向。
# 驱动真手的配置【绝不能】关掉它：抓握位姿不准是会撞坏东西的。
mag_fault_fatal=0

# 满行程。PC端/hand_mapping.py 的 SIM_RANGE_SCALE 同样是 1.0，两处相乘仍是
# 1.0 —— 真人握拳时仿真里也要能完整握拳。真实 Inspire 寄存器走另一条
# closure_to_counts() 路径，与这份配置无关。
range_scale=1.0
filter=one_euro
ema_alpha=0.25
one_euro_min_cutoff=1.5
one_euro_beta=0.10
one_euro_d_cutoff=1.0
deadzone=0.03
max_step=0.08
control_hz=30
# 纯仿真允许 USB/系统调度偶发短抖动：超过 200 ms 时保持上一姿态，
# 连续 1.5 秒收不到新帧才张手并退出。真手配置仍使用 500 ms 安全阈值。
stale_hold_ms=200
stale_abort_ms=1500
sensor_fault_warn_ms=150
sensor_fault_abort_ms=800
