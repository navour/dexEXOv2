# Inspire 左手遥操配置。端点来自2026-07-21逐通道实测。
# 当前使用电脑直连的 standalone_inspire_bridge.py，因此连接本机9102端口。
host=127.0.0.1
port=9102

# 顺序：小指,无名指,中指,食指,拇指弯曲,拇指对掌
# open为确认并提交的安全张手位。
open=980,965,957,946,949,922
# closed不是机械极限，已在逐通道实测端点基础上保留安全余量。
closed=60,60,70,60,70,150

# 10%和20%动态跟随均已通过，第三阶段开放30%（程序硬上限）。
range_scale=0.30
ema_alpha=0.25
deadzone=0.03
max_step=0.04
control_hz=30
stale_hold_ms=200
stale_abort_ms=500
# 短于150ms的传感器异常静默保持，持续异常才告警，800ms仍异常则张手退出。
sensor_fault_warn_ms=150
sensor_fault_abort_ms=800
