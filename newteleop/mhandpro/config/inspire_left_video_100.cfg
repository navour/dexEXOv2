# Inspire左手映射视频专用100%配置。
# 100%表示到达实测且留有余量的closed端点，不是机械极限。
# 拍摄结束后不要将本配置用于外骨骼力反馈联调。
host=127.0.0.1
port=9102

# 顺序：小指,无名指,中指,食指,拇指弯曲,拇指对掌
open=980,965,957,946,949,922
closed=60,60,70,60,70,150

range_scale=1.00
ema_alpha=0.20
deadzone=0.03
# 每周期最多改变3%的归一化行程；换算到最大通道约28 tick，小于桥接器50 tick限制。
max_step=0.03
control_hz=30
stale_hold_ms=200
stale_abort_ms=500
sensor_fault_warn_ms=150
sensor_fault_abort_ms=800

# OK/捏取协同：实测OK输入约为 index=0.80, thumb_flex=0.07, thumb_opp=0.27。
# 只有食指弯曲和拇指对掌同时出现才增强，不影响二者的单独动作。
pinch_assist=1
pinch_index_on=0.30
pinch_index_full=0.80
pinch_opp_on=0.08
pinch_opp_full=0.27
pinch_index_target=0.88
pinch_thumb_flex_target=0.78
pinch_thumb_opp_target=0.85
