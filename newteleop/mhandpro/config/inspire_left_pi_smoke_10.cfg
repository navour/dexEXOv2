# 树莓派首次冒烟测试专用配置：只开放10%行程。
# 树莓派本机运行standalone_inspire_bridge.py，因此连接127.0.0.1:9102。
host=127.0.0.1
port=9102

# 顺序：小指,无名指,中指,食指,拇指弯曲,拇指对掌
open=980,965,957,946,949,922
closed=60,60,70,60,70,150

range_scale=0.10
ema_alpha=0.25
deadzone=0.03
max_step=0.03
control_hz=30
stale_hold_ms=200
stale_abort_ms=500
sensor_fault_warn_ms=150
sensor_fault_abort_ms=800

# 冒烟测试只验证基础连续映射，不启用视频用捏取协同。
pinch_assist=0
