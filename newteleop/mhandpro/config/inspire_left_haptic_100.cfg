# 外骨骼力反馈联合测试的Inspire左手100%行程配置。
# 100%到达逐通道实测且已保留余量的closed端点，不是机械极限。
host=127.0.0.1
port=9102

# 顺序：小指,无名指,中指,食指,拇指弯曲,拇指对掌
open=980,965,957,946,949,922
closed=60,60,70,60,70,150

range_scale=1.00
ema_alpha=0.20
deadzone=0.03
# 每周期最多3%归一化行程，最大通道约28 tick，低于桥接器50 tick限制。
max_step=0.03
control_hz=30
stale_hold_ms=200
stale_abort_ms=500
sensor_fault_warn_ms=150
sensor_fault_abort_ms=800

# 力反馈验证保留原始六维映射，禁用视频配置中的额外捏取协同。
pinch_assist=0
